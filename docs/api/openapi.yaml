components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bait-el-kebash-session
      description: 'Laravel session cookie; actual name is configured by SESSION_COOKIE. Guest CSRF sessions are sufficient for public authentication endpoints.'
    xsrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: 'URL-decoded XSRF-TOKEN cookie value. Required for stateful mutations.'
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Existing Sanctum personal access tokens remain valid during compatibility; do not store these in the SPA.'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message
    Message:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      example: '30.30'
      description: 'Exact decimal string; currency is not yet confirmed.'
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        address:
          type: string
        role:
          type: string
          enum:
            - admin
            - customer
        email_verified_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - email
        - phone_number
        - address
        - role
        - email_verified_at
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category_id:
          type: integer
        category:
          $ref: '#/components/schemas/Category'
        unit_price:
          $ref: '#/components/schemas/Money'
        unit:
          type: string
          example: 0.5kg
        image_url:
          type: string
          format: uri
          nullable: true
      required:
        - id
        - name
        - description
        - category_id
        - category
        - unit_price
        - unit
        - image_url
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
          nullable: true
        product_unit:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
      required:
        - id
        - product_id
        - product_name
        - product_unit
        - quantity
        - unit_price
        - line_total
    Delivery:
      type: object
      properties:
        name:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
      required:
        - name
        - phone_number
        - address
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum:
            - pending
            - completed
            - cancelled
        delivery:
          $ref: '#/components/schemas/Delivery'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          $ref: '#/components/schemas/Money'
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - user_id
        - status
        - delivery
        - items
        - total
        - created_at
        - updated_at
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - order_id
        - message
        - read_at
        - created_at
    Dashboard:
      type: object
      properties:
        users:
          type: integer
        orders:
          type: integer
        products:
          type: integer
        categories:
          type: integer
        completed_orders:
          type: integer
        pending_orders:
          type: integer
        cancelled_orders:
          type: integer
        sales:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
                example: 2026-09
              total:
                $ref: '#/components/schemas/Money'
            required:
              - month
              - total
        category_products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              products_count:
                type: integer
            required:
              - id
              - name
              - products_count
      required:
        - users
        - orders
        - products
        - categories
        - completed_orders
        - pending_orders
        - cancelled_orders
        - sales
        - category_products
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              product:
                allOf:
                  -
                    $ref: '#/components/schemas/Product'
                nullable: true
              quantity:
                type: integer
              available:
                type: boolean
              line_total:
                type: string
                pattern: '^[0-9]+\.[0-9]{2}$'
                nullable: true
            required:
              - product_id
              - product
              - quantity
              - available
              - line_total
        total:
          type: string
          nullable: true
          description: 'Null if any product is unavailable; otherwise an exact two-decimal quote.'
      required:
        - items
        - total
    PhoneChallenge:
      type: object
      properties:
        verification_id:
          type: integer
        expires_at:
          type: string
          format: date-time
      required:
        - verification_id
        - expires_at
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
      required:
        - first
        - last
        - prev
        - next
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
            required:
              - url
              - label
              - active
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: 'Lowercase; unique.'
        password:
          type: string
          minLength: 8
          maxLength: 255
          format: password
        password_confirmation:
          type: string
          format: password
        phone_number:
          type: string
          pattern: '^01[0-9]{9}$'
