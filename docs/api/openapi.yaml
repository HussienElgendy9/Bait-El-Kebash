      operationId: post__api_v1_orders
      description: 'Server sets owner, pending status and exact prices. Rejects duplicate product IDs and extra line fields. Key is retained per user for the lifetime of the order: same key and normalized items replays with 200; changed items returns 409. Catalog/profile changes do not alter a replay. Order notifications run after commit; delivery failures are logged without changing checkout success. On a network error retry identical items with the SAME key.'
      security:
        -
          sessionCookie: []
          xsrf: []
        -
          bearerAuth: []
      responses:
        200:
          description: 'Idempotent replay; current order representation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
