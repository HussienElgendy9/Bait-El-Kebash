        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
