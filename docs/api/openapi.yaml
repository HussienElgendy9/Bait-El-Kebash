openapi: 3.0.3
info:
  title: 'Bait El Kebash API'
  version: 1.0.0
  description: 'Laravel backend for a separate, same-site first-party SPA. MVC and unversioned bearer APIs remain during compatibility. Initialize /sanctum/csrf-cookie then send Origin, credentials and X-XSRF-TOKEN on mutations. No browser tokens are minted by v1. Role is enforced by the server. Email verification is available but not required for checkout, matching existing behavior. Historical delivery/product snapshots may be null. No payment, inventory, tax, shipping charges or discounts are implemented.'
servers:
  -
    url: 'http://localhost:8000'
    description: 'Local API; configure the SPA at http://localhost:5173'
tags:
  -
    name: Catalog
  -
    name: Authentication
  -
    name: Account
  -
    name: Cart
  -
    name: Orders
  -
    name: Admin
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
        - Authentication
      summary: 'Initialize CSRF and session cookies'
      operationId: get__sanctum_csrf_cookie
      description: 'Sets XSRF-TOKEN and the configured HTTP-only session cookie. Use credentials: include. Mutation requests must send X-XSRF-TOKEN.'
      security: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
  /api/v1/products:
    get:
      tags:
        - Catalog
      summary: 'List products'
      operationId: get__api_v1_products
      description: 'List products'
      security: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        -
          name: category_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: 'Substring match on product name.'
        -
          name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - newest
              - price_asc
              - price_desc
            default: newest
  '/api/v1/products/{product}':
    get:
      tags:
        - Catalog
      summary: 'Get product'
      operationId: get__api_v1_products_product_
      description: 'Get product'
      security: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      parameters:
        -
          name: product
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
  /api/v1/categories:
    get:
      tags:
        - Catalog
      summary: 'List categories'
      operationId: get__api_v1_categories
      description: 'List categories'
      security: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
  '/api/v1/categories/{category}':
    get:
      tags:
        - Catalog
      summary: 'Get category'
      operationId: get__api_v1_categories_category_
      description: 'Get category'
      security: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      parameters:
        -
          name: category
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: 'Register and start a session'
      operationId: post__api_v1_auth_register
      description: 'Always creates a customer; role and unrecognized top-level fields are ignored. Unique email and phone races return 409. Does not send verification email automatically. Five requests/minute/IP by default.'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: 'Log in and rotate the session'
      operationId: post__api_v1_auth_login
      description: 'Invalid credentials return 422. Default 5 requests/minute/email+IP and 30/minute/IP. No personal token is issued.'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: 'Log out'
      operationId: post__api_v1_auth_logout
      description: 'Invalidates the current browser session and rotates CSRF, or deletes the current bearer token.'
      security:
        -
          sessionCookie: []
          xsrf: []
        -
          bearerAuth: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: 'Request a password reset link'
      operationId: post__api_v1_auth_forgot_password
      description: 'Generic response for known/unknown addresses. Email delivery must be explicitly enabled with a working mail transport; otherwise 503. Links target FRONTEND_URL/reset-password.'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: 'Reset password using a broker token'
      operationId: post__api_v1_auth_reset_password
      description: 'Token expires after 60 minutes, is single-use, and is tied to the email. Revokes existing bearer tokens; authenticated SPA sessions are invalidated by password-hash mismatch.'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInput'
  /api/v1/auth/confirm-password:
    post:
      tags:
        - Authentication
      summary: 'Confirm the current password'
      operationId: post__api_v1_auth_confirm_password
      description: 'Confirm the current password'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmInput'
  '/api/v1/auth/verify-email/{id}/{hash}':
    get:
      tags:
        - Account
      summary: 'Consume a signed email verification link'
      operationId: get__api_v1_auth_verify_email_id_hash_
      description: 'Requires authentication as the URL user, matching SHA1 email hash and unmodified Laravel signature. Generated links expire after 60 minutes. Repeated valid requests return 204.'
      security:
        -
          sessionCookie: []
        -
          bearerAuth: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        -
          name: hash
          in: path
          required: true
          schema:
            type: string
        -
          name: expires
          in: query
          required: true
          schema:
            type: integer
        -
          name: signature
          in: query
          required: true
          schema:
            type: string
  /api/v1/me:
    get:
      tags:
        - Account
      summary: 'Read current profile'
      operationId: get__api_v1_me
      description: 'Read current profile'
      security:
        -
          sessionCookie: []
        -
          bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
    patch:
      tags:
        - Account
      summary: 'Update own name, email or address'
      operationId: patch__api_v1_me
      description: 'Changing email clears email_verified_at. Role and phone changes are ignored; phone changes require verification.'
      security:
        -
          sessionCookie: []
          xsrf: []
        -
          bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
    delete:
      tags:
        - Account
      summary: 'Delete own account without order history'
      operationId: delete__api_v1_me
      description: 'Requires current password. Accounts with any orders or administrator role return 409. Session is invalidated.'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmInput'
  /api/v1/me/password:
    put:
      tags:
        - Account
      summary: 'Change own password'
      operationId: put__api_v1_me_password
      description: 'Requires current password. Revokes bearer tokens and rotates current session; other SPA sessions fail password-hash validation.'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
  /api/v1/me/email/verification-notification:
    post:
      tags:
        - Account
      summary: 'Request email verification'
      operationId: post__api_v1_me_email_verification_notification
      description: 'Six requests/minute. 204 if already verified; otherwise sends a FRONTEND_URL/verify-email link carrying verification_url, or 503 when delivery unavailable.'
      security:
        -
          sessionCookie: []
          xsrf: []
        -
          bearerAuth: []
      responses:
        200:
          description: 'Verification email requested'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        204:
          description: 'Already verified'
        401:
          $ref: '#/components/responses/401'
        419:
          $ref: '#/components/responses/419'
        429:
          $ref: '#/components/responses/429'
        503:
          $ref: '#/components/responses/503'
  /api/v1/me/phone/request:
    post:
      tags:
        - Account
      summary: 'Request a phone-change challenge'
      operationId: post__api_v1_me_phone_request
      description: 'Default 3 requests/10 minutes/user and 10/10 minutes/IP. Invalidates older challenges. Codes are hashed, expire in 10 minutes, never returned or logged. Default sender is unavailable: 503 until a real adapter is configured.'
      security:
        -
          sessionCookie: []
          xsrf: []
        -
          bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneChallengeEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequestInput'
  /api/v1/me/phone/verify:
    post:
      tags:
        - Account
      summary: 'Verify and atomically claim a phone number'
      operationId: post__api_v1_me_phone_verify
      description: 'Owner-only single consumption. Up to five attempts per challenge; fifth wrong attempt returns 429 and invalidates it. Later invalid/replayed/expired requests return 422. Default 10 requests/minute/user. Uniqueness race returns 409.'
      security:
        -
          sessionCookie: []
          xsrf: []
        -
          bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerifyInput'
  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: 'Read the session cart and current price quote'
      operationId: get__api_v1_cart
      description: 'Session cart shares MVC storage. Reprices from catalog. Removed products are marked available=false with null line_total; cart total becomes null.'
      security:
        -
          sessionCookie: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
    delete:
      tags:
        - Cart
      summary: 'Clear the session cart'
      operationId: delete__api_v1_cart
      description: 'Clear the session cart'
      security:
        -
          sessionCookie: []
          xsrf: []
      responses:
        204:
          description: 'Success; empty body'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        419:
          $ref: '#/components/responses/419'
        422:
          $ref: '#/components/responses/422'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
  /api/v1/cart/items:
    post:
      tags:
        - Cart
      summary: 'Add quantity to a session cart item'
      operationId: post__api_v1_cart_items
      description: 'Maximum 100 distinct products and 1000 integer units per product. Checkout still submits explicit items and reprices.'
      security:
        -
          sessionCookie: []
