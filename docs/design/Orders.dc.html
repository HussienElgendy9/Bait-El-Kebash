<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بيت الكباش — طلباتي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" lang="ar" style="{{rootStyle}}">
<dc-import name="Header" layout="{{layout}}" title="طلباتي" active="orders" hint-size="100%,64px"></dc-import>

<main style="max-width: 800px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{d}}" hint-placeholder-val="{{ true }}">
<h1 style="margin: 0; font-size: 36px; line-height: 1.3; font-weight: 700; color: #1F4D3A">طلباتي</h1>
</sc-if>

<sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="4">
<li>
<a href="#order" style="background: #FFFFFF; border: 1px solid #D0BFA9; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; color: #2A1A14; text-decoration: none; min-height: 88px; box-sizing: border-box">
<div role="img" aria-label="real sheep photo" dir="ltr" style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 12px; background: #F7F4EE; color: #585850; font-size: 10px; display: flex; align-items: center; justify-content: center; text-align: center">real sheep photo</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<strong style="font-size: 16px">{{o.name}}</strong>
<span style="font-size: 14px; color: #585850">طلب <span dir="ltr">#{{o.id}}</span> · {{o.date}}</span>
<span style="font-size: 14px; font-weight: 600; color: #A85431">{{o.total}} ج.م</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="{{o.pill}}">{{o.icon}} {{o.status}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#585850" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</div>
</a>
</li>
</sc-for>
</ul>
</sc-if>

<sc-if value="{{showLoading}}" hint-placeholder-val="{{ false }}">
<div aria-busy="true" aria-label="جاري تحميل طلباتك" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{skeletons}}" as="s" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #D0BFA9; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; height: 88px; box-sizing: border-box">
<span style="width: 64px; height: 64px; border-radius: 12px; background: rgba(208,191,169,0.4)"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px"><span style="height: 14px; width: 50%; border-radius: 6px; background: rgba(208,191,169,0.45)"></span><span style="height: 12px; width: 35%; border-radius: 6px; background: rgba(208,191,169,0.35)"></span></span>
<span style="width: 96px; height: 32px; border-radius: 999px; background: rgba(208,191,169,0.35)"></span>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showEmpty}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 1.5px dashed #D0BFA9; border-radius: 16px; padding: 48px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 999px; background: #BDD0C6; color: #1F4D3A; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>
<strong style="font-size: 20px">لسه ما طلبتش أضحية</strong>
<span style="color: #585850; font-size: 15px">أول طلب هيظهر هنا وتقدر تتابع حالته.</span>
<a href="{{listingHref}}" style="margin-top: 6px; height: 48px; padding-inline: 24px; border-radius: 12px; background: #1F4D3A; color: #FFFFFF; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">تصفّح الأضاحي</a>
</div>
</sc-if>

<sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="background: #FFFFFF; border: 1.5px solid #A85431; border-radius: 16px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 56px; height: 56px; border-radius: 999px; background: #F7F4EE; color: #A85431; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></svg></span>
<strong style="font-size: 18px">مقدرناش نحمّل طلباتك</strong>
<span style="color: #585850; font-size: 15px">اتأكد من الإنترنت وجرّب تاني.</span>
<button type="button" onClick="{{retry}}" style="margin-top: 6px; height: 44px; padding-inline: 20px; border-radius: 12px; border: 0; background: #1F4D3A; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">حاول تاني</button>
</div>
</sc-if>
</main>

<dc-import name="Dock" layout="{{layout}}" active="orders" hint-size="100%,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"layout":{"editor":"enum","options":["auto","mobile","desktop"],"default":"auto"},"listState":{"editor":"enum","options":["loaded","loading","empty","error"],"default":"loaded"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { w: (typeof window !== 'undefined' ? window.innerWidth : 1280), ls: null };
    this.onResize = () => this.setState({ w: window.innerWidth });
  }
  componentDidMount() { window.addEventListener('resize', this.onResize); this.onResize(); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearTimeout(this.t); }
  renderVals() {
    const L = this.props.layout ?? 'auto';
    const m = L === 'mobile' || (L === 'auto' && this.state.w < 768);
    const ls = this.state.ls ?? this.props.listState ?? 'loaded';
    const pill = (bg, fg) => 'display: inline-flex; align-items: center; gap: 6px; height: 32px; padding-inline: 12px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; background: ' + bg + '; color: ' + fg;
    // GET /orders — status: pending | processing | completed | cancelled
    const S = {
      pending: ['قيد الانتظار', '◷', pill('#D0BFA9', '#2A1A14')],
      processing: ['جاري التجهيز', '↻', pill('#BDD0C6', '#1F4D3A')],
      completed: ['تم التسليم', '✓', pill('#1F4D3A', '#FFFFFF')],
      cancelled: ['ملغي', '✕', pill('#585850', '#FFFFFF')]
    };
    const orders = [
      { id: 1025, name: 'خروف برقي', date: '11 أكتوبر 2026', total: '17,800', status: 'pending' },
      { id: 1024, name: 'خروف رحماني', date: '10 أكتوبر 2026', total: '14,500', status: 'processing' },
      { id: 987, name: 'خروف فلاحي', date: '20 مايو 2026', total: '15,900', status: 'completed' },
      { id: 951, name: 'ماعز زرايبي', date: '18 مايو 2026', total: '9,900', status: 'cancelled' }
    ].map((o) => ({ ...o, status: S[o.status][0], icon: S[o.status][1], pill: S[o.status][2] }));
    return {
      m, d: !m, layout: m ? 'mobile' : 'desktop',
      rootStyle: 'font-family: \'IBM Plex Sans Arabic\', sans-serif; color: #2A1A14; background: #F7F4EE; min-height: 100vh; font-size: 16px; line-height: 1.6' + (m ? '; padding-bottom: 72px' : ''),
      listingHref: m ? 'Listing-mobile.dc.html' : 'Listing.dc.html',
      orders, skeletons: [1, 2, 3],
      showList: ls === 'loaded', showLoading: ls === 'loading', showEmpty: ls === 'empty', showError: ls === 'error',
      retry: () => { this.setState({ ls: 'loading' }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ ls: 'loaded' }), 900); }
    };
  }
}
</script>
</body>
</html>
